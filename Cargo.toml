# name: Cargo.toml
# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
members = [
  "src/core",
  "src/dsl",
  "src/adapter",
  "src/cli",
]
exclude = [
  "fuzz",
  "examples/candle_eval",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"

authors = ["flat-sauce-works"]
repository = "https://github.com/flat-sauce-works/LiminiKa"
readme = "README.md"
keywords = ["llm", "liminika", "sheaf-theory", "zero-alloc", "c-abi"]
categories = ["science", "embedded", "no-std", "hardware-support"]

[workspace.dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "std", "zeroize"] }
getrandom = "0.3"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[workspace.lints.clippy]
module_name_repetitions = "allow"
must_use_candidate = "allow"
inline_always = "allow"
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
overflow-checks = false
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = false
debug = false

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1