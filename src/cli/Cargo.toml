# name: src/cli/Cargo.toml
# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "liminika-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "liminika"
path = "src/main.rs"

[features]
default = []

[dependencies]
liminika-adapter = { path = "../adapter" }
liminika-core = { path = "../core" }
liminika-dsl = { path = "../dsl" }

[lints]
workspace = true

[[test]]
name = "fuzz_regression"
path = "../../tests/integration/fuzz_regression.rs"