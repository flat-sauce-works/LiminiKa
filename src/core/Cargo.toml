# name: src/core/Cargo.toml
# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "liminika-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core execution engine library for the Geometric Cellular Sheaf Orchestrator (GCSO)"
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "liminika_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
simd = []
avx2 = ["simd"]
avx512 = ["simd", "avx2"]
neon = ["simd"]
sve = ["simd"]
rvv = ["simd"]
cuda = []
metal = []
vulkan = []

[build-dependencies]
cmake = "0.1"

[dev-dependencies]
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "bench_phase_steering"
harness = false
path = "../../benches/bench_phase_steering.rs"

[[bench]]
name = "bench_entropy_control"
harness = false
path = "../../benches/bench_entropy_control.rs"

[[test]]
name = "test_zero_alloc"
path = "../../tests/core/test_zero_alloc.rs"

[[test]]
name = "test_abi_layout"
path = "../../tests/ffi/test_abi_layout.rs"
