# name: src/core/Cargo.toml
# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "liminika-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core execution engine library for the Geometric Cellular Sheaf Orchestrator (GCSO)"
readme = "../../README.md"

[lib]
name = "liminika_core"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
simd = []
avx2 = ["simd"]
avx512 = ["simd", "avx2"]
neon = ["simd"]
sve = ["simd"]
rvv = ["simd"]
cuda = []
metal = []
vulkan = []

[build-dependencies]
cmake = "0.1"

[dev-dependencies]
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "bench_dpsr"
harness = false
path = "../../benches/bench_dpsr.rs"

[[bench]]
name = "bench_edbc"
harness = false
path = "../../benches/bench_edbc.rs"