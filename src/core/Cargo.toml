[package]
name = "liminika-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "liminika_core"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
cuda = []
metal = []
vulkan = []

[dependencies]
# Runtime dependencies go here (keep empty if zero-dependency in hot path)

[build-dependencies]
# Build script dependencies for C/C++ compilation via CMake or CC
cc = "1.0"
cmake = "0.1"