# .github/workflows/ci.yml
# SPDX-License-Identifier: MIT OR Apache-2.0

name: CI Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Security: Principle of Least Privilege (Read-only by default for all jobs)
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # =========================================================================
  # 1. AUTO-FORMAT CODEBASE BEFORE TESTING
  # =========================================================================
  auto-format:
    name: Auto-Format Codebase Before Testing
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Granted strictly for committing formatted code back to repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install clang-format & Python formatters
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format python3-autopep8

      - name: Format Rust codebase
        run: cargo fmt --all

      - name: Format C/C++ & GPU Kernel codebase
        run: |
          EXCLUDE_DIRS="\( -name target -o -name build* -o -name cmake-build* -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \)"
          find . $EXCLUDE_DIRS -prune -o \( \
            -name "*.h" -o -name "*.hpp" -o -name "*.inl" -o \
            -name "*.c" -o -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o \
            -name "*.cu" -o -name "*.cuh" -o -name "*.metal" -o \
            -name "*.comp" -o -name "*.vert" -o -name "*.frag" -o \
            -name "*.glsl" -o -name "*.hlsl" -o -name "*.wgsl" -o -name "*.slang" -o \
            -name "*.hip" -o -name "*.cl" \
          \) -type f -size +0c ! -name ".gitkeep" -exec clang-format -i {} + 2>/dev/null || true

      - name: Format Python codebase
        run: |
          EXCLUDE_DIRS="\( -name target -o -name build* -o -name cmake-build* -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \)"
          find . $EXCLUDE_DIRS -prune -o -name "*.py" -type f -size +0c -exec autopep8 --in-place --aggressive --aggressive {} + 2>/dev/null || true

      - name: Commit formatting changes if needed
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: "style(ci): auto-format codebase before testing [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

  # =========================================================================
  # 2. PATH CHANGED DETECTION
  # =========================================================================
  changes:
    name: Detect Changed Paths
    needs: auto-format
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      dsl: ${{ steps.filter.outputs.dsl }}
      license: ${{ steps.filter.outputs.license }}
      meta: ${{ steps.filter.outputs.meta }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Filter path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cpp:
              - 'include/**'
              - 'src/**'
              - 'examples/**'
              - 'tests/**'
              - 'benches/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - '**/CMakeLists.txt'
              - '**/*.cmake'
              - '**/*.h'
              - '**/*.hpp'
              - '**/*.inl'
              - '**/*.c'
              - '**/*.cpp'
              - '**/*.cc'
              - '**/*.cxx'
              - '**/*.cu'
              - '**/*.cuh'
              - '**/*.metal'
              - '**/*.comp'
              - '**/*.vert'
              - '**/*.frag'
              - '**/*.glsl'
              - '**/*.hlsl'
              - '**/*.wgsl'
              - '**/*.slang'
              - '**/*.hip'
              - '**/*.cl'
              - '.clang-format'
              - '.github/workflows/**'
            rust:
              - 'include/**'
              - 'src/**'
              - 'examples/**'
              - 'tests/**'
              - 'benches/**'
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - '**/build.rs'
              - 'Cargo.lock'
              - 'deny.toml'
              - '**/*.rs'
              - '.github/workflows/**'
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'requirements.txt'
              - '.github/workflows/**'
            dsl:
              - 'src/dsl/**'
              - 'examples/dsl/**'
              - 'tests/dsl/**'
              - '**/*.lmnk'
              - '.github/workflows/**'
            license:
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'LICENSE*'
              - 'src/**'
              - 'include/**'
              - 'tests/**'
              - 'examples/**'
              - 'benches/**'
              - 'cmake/**'
              - '**/CMakeLists.txt'
              - '**/build.rs'
              - '.github/workflows/**'
            meta:
              - 'CITATION.cff'
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - '*.md'
              - '**/*.md'
              - '.github/workflows/**'

  # =========================================================================
  # 3. LICENSE & DEPENDENCY SAFETY CHECK (STRICT PERMISSIVE GUARANTEE)
  # =========================================================================
  license-safety-check:
    name: License & Dependency Safety
    needs: [auto-format, changes]
    if: ${{ always() && !cancelled() && (needs.changes.outputs.license == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny check (Licenses, Bans, Advisories, Sources)
        run: |
          if [ -f "deny.toml" ]; then
            cargo deny check
          else
            echo "No deny.toml found; skipping cargo-deny check."
          fi

      - name: Scan Copyleft & Non-Permissive License Keywords
        run: |
          echo "Scanning codebase for strict permissive compliance (blocking Copyleft/Non-Commercial)..."
          EXCLUDE_DIRS="\( -name target -o -name build* -o -name cmake-build* -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \)"
          
          # Check for forbidden copyleft / non-commercial license identifiers in source/build files (excluding docs & deny.toml)
          FORBIDDEN_PATTERNS="GPL-1.0|GPL-2.0|GPL-3.0|LGPL-2.1|LGPL-3.0|AGPL-3.0|SSPL-1.0|CC-BY-NC|MPL-1.1|MPL-2.0|EPL-1.0|EPL-2.0|CDDL-1.0|EUPL-1.1|EUPL-1.2|PolyForm|CPAL-1.0|Watcom-1.0"
          FOUND_VIOLATIONS=$(find . $EXCLUDE_DIRS -prune -o -type f -size +0c ! -name "deny.toml" ! -name "ci.yml" ! -name "*.md" -exec grep -E -H -n "$FORBIDDEN_PATTERNS" {} + 2>/dev/null || true)

          if [ -n "$FOUND_VIOLATIONS" ]; then
            echo "Error: Copyleft or non-permissive license keywords detected in codebase:"
            echo "$FOUND_VIOLATIONS"
            exit 1
          fi
          echo "No non-permissive license keywords detected."

      - name: Verify SPDX License Headers in Source Files
        run: |
          echo "Checking SPDX License Headers in non-empty source files..."
          EXCLUDE_DIRS="\( -name target -o -name build* -o -name cmake-build* -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \)"
          
          # Check C/C++/Rust/Metal/CUDA source files using // comment pattern
          SLASH_FILES=$(find . $EXCLUDE_DIRS -prune -o \( \
            -name "*.rs" -o -name "*.c" -o -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o \
            -name "*.cu" -o -name "*.cuh" -o -name "*.metal" -o -name "*.comp" -o -name "*.vert" -o -name "*.frag" -o \
            -name "*.glsl" -o -name "*.hlsl" -o -name "*.wgsl" -o -name "*.slang" -o -name "*.hip" -o -name "*.cl" -o \
            -name "*.h" -o -name "*.hpp" -o -name "*.inl" \
          \) -type f -size +0c ! -name ".gitkeep" -exec grep -L "SPDX-License-Identifier: MIT OR Apache-2.0" {} + 2>/dev/null || true)

          # Check Python/CMake/YAML/Shell/DSL files using # comment pattern
          HASH_FILES=$(find . $EXCLUDE_DIRS -prune -o \( \
            -name "*.py" -o -name "*.lmnk" -o -name "*.sh" -o -name "CMakeLists.txt" -o -name "*.cmake" -o \
            -name "*.yml" -o -name "*.yaml" \
          \) -type f -size +0c ! -name ".gitkeep" -exec grep -L "SPDX-License-Identifier: MIT OR Apache-2.0" {} + 2>/dev/null || true)

          MISSING_FILES=""
          if [ -n "$SLASH_FILES" ]; then MISSING_FILES="$SLASH_FILES"; fi
          if [ -n "$HASH_FILES" ]; then MISSING_FILES="$(printf "%s\n%s" "$MISSING_FILES" "$HASH_FILES" | sed '/^$/d')"; fi

          if [ -n "$MISSING_FILES" ]; then
            echo "Error: The following non-empty source files are missing valid SPDX license headers:"
            echo "$MISSING_FILES"
            exit 1
          fi
          echo "All non-empty source files contain valid SPDX headers."

  # =========================================================================
  # 4. C/C++ & GPU KERNELS BUILD MATRIX
  # =========================================================================
  cpp-build-matrix:
    name: C/C++ & GPU Kernels Build (${{ matrix.os }})
    needs: [auto-format, changes]
    if: ${{ always() && !cancelled() && (needs.changes.outputs.cpp == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup CUDA Toolkit (Linux)
        if: runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.2.0'

      - name: Setup MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Build Dependencies & Cache Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang clang-format cmake libclang-dev ccache vulkan-tools shaderc glslang-tools

      - name: Install Build Dependencies & Cache Tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja cmake ccache clang-format || true

      - name: Install Build Dependencies & Cache Tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja ccache llvm --no-progress || true

      - name: Setup Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-cpp-${{ github.sha }}
          restore-keys: ${{ runner.os }}-cpp-

      - name: Verify C-ABI Header Self-Containment (C11 & C++20)
        if: runner.os == 'Linux'
        run: |
          echo "Checking C-ABI headers self-containment in include directory..."
          if [ -d "include" ]; then
            HEADERS=$(find include -type f \( -name "*.h" -o -name "*.hpp" \) -size +0c 2>/dev/null || true)
            if [ -n "$HEADERS" ]; then
              for header in $HEADERS; do
                if [[ "$header" == *.h ]]; then
                  echo "Validating C11 inclusion for $header..."
                  clang -std=c11 -Iinclude -fsyntax-only -x c "$header"
                fi
                echo "Validating C++20 inclusion for $header..."
                clang++ -std=c++20 -Iinclude -fsyntax-only -x c++ "$header"
              done
            else
              echo "No non-empty header files found under include."
            fi
          else
            echo "Directory include does not exist yet."
          fi

      - name: Validate GPU Shader Code (Vulkan/GLSL if present)
        if: runner.os == 'Linux'
        run: |
          if command -v glslangValidator >/dev/null 2>&1; then
            EXCLUDE_DIRS="\( -name target -o -name build* -o -name cmake-build* -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \)"
            SHADERS=$(find . $EXCLUDE_DIRS -prune -o \( -name "*.comp" -o -name "*.vert" -o -name "*.frag" -o -name "*.glsl" \) -type f -size +0c -print 2>/dev/null || true)
            if [ -n "$SHADERS" ]; then
              echo "Compiling Vulkan shaders..."
              for shader in $SHADERS; do
                echo "Validating $shader..."
                glslangValidator -V "$shader" -o /dev/null
              done
            else
              echo "No Vulkan shader files found to compile."
            fi
          else
            echo "glslangValidator not found; skipping shader compilation check."
          fi

      - name: Validate Metal Shader Code (macOS if present)
        if: runner.os == 'macOS'
        run: |
          EXCLUDE_DIRS="\( -name target -o -name build* -o -name cmake-build* -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \)"
          METAL_FILES=$(find . $EXCLUDE_DIRS -prune -o -name "*.metal" -type f -size +0c -print 2>/dev/null || true)
          if [ -n "$METAL_FILES" ]; then
            echo "Compiling Metal shaders..."
            for shader in $METAL_FILES; do
              echo "Validating $shader..."
              xcrun -sdk macosx metal -fsyntax-only "$shader"
            done
          else
            echo "No Metal shader files found to compile."
          fi

      - name: Validate CUDA Kernel Code (via nvcc)
        if: runner.os == 'Linux'
        run: |
          if command -v nvcc >/dev/null 2>&1; then
            EXCLUDE_DIRS="\( -name target -o -name build* -o -name cmake-build* -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \)"
            CUDA_FILES=$(find . $EXCLUDE_DIRS -prune -o \( -name "*.cu" -o -name "*.cuh" \) -type f -size +0c -print 2>/dev/null || true)
            if [ -n "$CUDA_FILES" ]; then
              echo "Validating CUDA kernel syntax..."
              for cu_file in $CUDA_FILES; do
                echo "Validating $cu_file..."
                nvcc -fsyntax-only -Iinclude "$cu_file"
              done
            else
              echo "No CUDA files found to compile."
            fi
          else
            echo "nvcc not available; skipping CUDA syntax verification."
          fi

      - name: Configure CMake (Linux & Windows)
        if: runner.os != 'macOS'
        run: |
          if [ -f "CMakeLists.txt" ]; then
            cmake -B build -S . -GNinja \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DLIMINIKA_ENABLE_CUDA=OFF \
              -DLIMINIKA_ENABLE_VULKAN=OFF \
              -DLIMINIKA_BUILD_TESTS=ON \
              -DLIMINIKA_BUILD_EXAMPLES=ON \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
          else
            echo "No root CMakeLists.txt found; skipping CMake configure."
          fi

      - name: Configure CMake (macOS with Metal enabled)
        if: runner.os == 'macOS'
        run: |
          if [ -f "CMakeLists.txt" ]; then
            cmake -B build -S . -GNinja \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DLIMINIKA_ENABLE_METAL=ON \
              -DLIMINIKA_ENABLE_CUDA=OFF \
              -DLIMINIKA_ENABLE_VULKAN=OFF \
              -DLIMINIKA_BUILD_TESTS=ON \
              -DLIMINIKA_BUILD_EXAMPLES=ON \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
          else
            echo "No root CMakeLists.txt found; skipping CMake configure."
          fi

      - name: Build C/C++ targets
        run: |
          if [ -d "build" ]; then
            cmake --build build
          else
            echo "Build directory does not exist; skipping build step."
          fi

      - name: Run C/C++ unit tests
        run: |
          if [ -d "build" ]; then
            ctest --test-dir build --output-on-failure --no-tests=ignore
          else
            echo "Build directory does not exist; skipping test execution."
          fi

  # =========================================================================
  # 5. RUST WORKSPACE CHECK & TEST MATRIX
  # =========================================================================
  rust-check-matrix:
    name: Rust Workspace (${{ matrix.os }})
    needs: [auto-format, changes]
    if: ${{ always() && !cancelled() && (needs.changes.outputs.rust == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install C/C++ & LLVM Dependencies for FFI/Bindgen (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libclang-dev clang

      - name: Install C/C++ & LLVM Dependencies for FFI/Bindgen (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja llvm || true
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV

      - name: Install C/C++ & LLVM Dependencies for FFI/Bindgen (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja llvm --no-progress || true
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $GITHUB_ENV
          echo "LLVM_CONFIG_PATH=C:\Program Files\LLVM\bin\llvm-config.exe" >> $GITHUB_ENV
          echo "C:\Program Files\LLVM\bin" >> $GITHUB_PATH

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      - name: Fast check Rust workspace (Default, No-Default & All Features)
        run: |
          if [ -f "Cargo.toml" ]; then
            CARGO_FLAGS="--locked"
            if ! cargo check --workspace --all-targets --locked 2>/dev/null; then
              echo "Warning: Cargo.lock is out of sync with Cargo.toml. Falling back without --locked..."
              CARGO_FLAGS=""
            fi
            cargo check --workspace --all-targets $CARGO_FLAGS
            cargo check --workspace --all-targets --no-default-features $CARGO_FLAGS
            cargo check --workspace --all-targets --all-features $CARGO_FLAGS
          else
            echo "No root Cargo.toml found; skipping cargo check."
          fi

      - name: Verify Rust benchmarks compilation
        run: |
          if [ -f "Cargo.toml" ]; then
            EXCLUDE_DIRS="\( -name target -o -name build* -o -name cmake-build* -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \)"
            BENCH_EXISTS=$(find . $EXCLUDE_DIRS -prune -o -name "*.rs" -type f -print 2>/dev/null | grep -E "(bench|benches)" || true)
            HAS_BENCH_TARGET=$(cargo metadata --format-version 1 2>/dev/null | grep -q '"kind":\["bench"\]' && echo "yes" || true)
            if [ -n "$BENCH_EXISTS" ] || [ "$HAS_BENCH_TARGET" = "yes" ]; then
              echo "Benchmark targets detected. Running cargo check --benches..."
              cargo check --workspace --benches --all-features || echo "No explicit bench targets compiled."
            else
              echo "No benchmark targets found; skipping bench check."
            fi
          fi

      - name: Run cargo clippy
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo clippy --workspace --all-targets -- -D warnings
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          fi

      - name: Check Rust documentation integrity (Ubuntu only)
        if: runner.os == 'Linux' && hashFiles('Cargo.toml') != ''
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

      - name: Run Rust workspace unit, integration, & zero-alloc tests via nextest
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo test --workspace --doc --all-features
            cargo nextest run --workspace --all-targets --all-features
          fi

  # =========================================================================
  # 6. DSL SPEC & EXAMPLES VALIDATION
  # =========================================================================
  dsl-validation:
    name: Validate DSL Spec & Examples
    needs: [auto-format, changes]
    if: ${{ always() && !cancelled() && (needs.changes.outputs.dsl == 'true' || needs.changes.outputs.rust == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      - name: Build DSL package & CLI parser
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo build --workspace
          fi

      - name: Validate Example DSL files
        run: |
          echo "Validating DSL files in repository..."
          EXCLUDE_DIRS="\( -name target -o -name build* -o -name cmake-build* -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \)"
          DSL_FILES=$(find . $EXCLUDE_DIRS -prune -o -name "*.lmnk" -type f -print 2>/dev/null || true)
          if [ -n "$DSL_FILES" ]; then
            for file in $DSL_FILES; do
              echo "Checking $file..."
              if [ -f "Cargo.toml" ] && cargo metadata --format-version 1 2>/dev/null | grep -qE '"name":"(liminika-cli|liminika)"'; then
                cargo run --workspace -- check "$file" || echo "CLI check command completed for $file"
              else
                echo "Skipping CLI check command as CLI package is not fully configured yet."
              fi
            done
          else
            echo "No DSL (.lmnk) files found to validate."
          fi

  # =========================================================================
  # 7. PYTHON SCRIPT SYNTAX VERIFICATION
  # =========================================================================
  python-check:
    name: Python Script Syntax Verification
    needs: [auto-format, changes]
    if: ${{ always() && !cancelled() && (needs.changes.outputs.python == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python Syntax & Run Tests
        run: |
          echo "Verifying Python syntax..."
          EXCLUDE_DIRS="\( -name target -o -name build* -o -name cmake-build* -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \)"
          PY_FILES=$(find . $EXCLUDE_DIRS -prune -o -name "*.py" -type f -print 2>/dev/null || true)

          if [ -n "$PY_FILES" ]; then
            echo "$PY_FILES" | xargs python -m py_compile
            echo "All Python scripts passed syntax validation."
          else
            echo "No Python files found to validate."
          fi

          if [ -d "tests" ]; then
            PY_TEST_FILES=$(find tests -type f \( -name "test_*.py" -o -name "*_test.py" \) 2>/dev/null || true)
            if [ -n "$PY_TEST_FILES" ]; then
              echo "Running Python tests..."
              python -m unittest discover -s tests
            fi
          fi

  # =========================================================================
  # 8. META & CITATION VALIDATION
  # =========================================================================
  meta-citation-check:
    name: Validate Meta & Citation Files
    needs: [auto-format, changes]
    if: ${{ always() && !cancelled() && (needs.changes.outputs.meta == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cffconvert
        run: |
          python -m pip install --upgrade pip
          pip install cffconvert

      - name: Validate CITATION.cff Schema
        run: |
          if [ -f "CITATION.cff" ]; then
            cffconvert --validate
          else
            echo "CITATION.cff file not present; skipping check."
          fi

  # =========================================================================
  # 9. DOCUMENTATION INTEGRITY & LINK CHECK
  # =========================================================================
  docs-check:
    name: Documentation Integrity & Link Check
    needs: [auto-format, changes]
    if: ${{ always() && !cancelled() && (needs.changes.outputs.docs == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Check markdown broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --offline '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}