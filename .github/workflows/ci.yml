name: CI Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write

jobs:
  # Job 0: Path filtering to detect modified file locations
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      rust: ${{ steps.filter.outputs.rust }}
      license: ${{ steps.filter.outputs.license }}
      meta: ${{ steps.filter.outputs.meta }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cpp:
              - 'include/**'
              - 'src/kernels/**'
              - 'CMakeLists.txt'
              - '.clang-format'
              - '.github/workflows/ci.yml'
            rust:
              - 'src/cli/**'
              - 'src/core/**'
              - 'src/dsl/**'
              - 'tests/**'
              - 'benches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            license:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'LICENSE*'
              - '.github/workflows/ci.yml'
            meta:
              - 'CITATION.cff'
              - '.github/workflows/ci.yml'

  # Job 1: C/C++ Build, Format & Safe Auto-commit
  cpp-build-format:
    name: C/C++ Build & Format Check
    needs: changes
    if: ${{ needs.changes.outputs.cpp == 'true' }}
    runs-on: ubuntu-latest

    steps:
      # Checkout the head branch of the Pull Request so formatting commits target the correct ref
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install build tools and clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-format ninja-build

      - name: Configure CMake
        run: |
          cmake -B build -S . -GNinja

      - name: Execute automatic clang-format
        run: |
          cmake --build build --target format

      - name: Build C/C++ targets
        run: |
          cmake --build build

      - name: Run C/C++ unit tests
        run: |
          ctest --test-dir build --output-on-failure

      # Auto-commit formatted code.
      # Note: Forked PRs do not have write permissions for GITHUB_TOKEN due to GitHub security restrictions.
      # `continue-on-error: true` ensures that failure to push on forked PRs will not cause the overall CI job to fail.
      - name: Auto-commit formatted code (Safe for Fork PRs)
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: "style(format): auto-format C/C++ codebase via CI [skip ci]"
          file_pattern: "include/* src/kernels/*"

  # Job 2: Rust Compilation, Linting & Unit Testing
  rust-check:
    name: Rust (Formatting, Lint & Test)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

  # Job 3: License & Dependency Security Check
  license-safety-check:
    name: License & Dependency Safety
    needs: changes
    if: ${{ needs.changes.outputs.license == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace

  # Job 4: Metadata & Citation Validation
  meta-citation-check:
    name: Validate Meta & Citation Files
    needs: changes
    if: ${{ needs.changes.outputs.meta == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate CITATION.cff
        run: |
          python -c "import yaml; yaml.safe_load(open('CITATION.cff'))"