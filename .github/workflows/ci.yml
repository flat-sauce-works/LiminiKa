# name: .github/workflows/ci.yml
# SPDX-License-Identifier: MIT OR Apache-2.0

name: CI Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUST_MIN_STACK: "16777216"
  CARGO_TERM_COLOR: always

jobs:
  # =========================================================================
  # 1. AUTO-FORMAT CODEBASE BEFORE TESTING
  # =========================================================================
  auto-format:
    name: Auto-Format Codebase Before Testing
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install clang-format & Python formatters
        run: |
          if ! command -v clang-format >/dev/null 2>&1 || ! command -v autopep8 >/dev/null 2>&1; then
            if ! sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 update; then
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null || true
              fi
              sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 update || true
            fi
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 install -y clang-format python3-autopep8 || true
          fi
          if ! command -v autopep8 >/dev/null 2>&1; then
            python3 -m pip install --quiet --retries 1 --timeout 10 autopep8 2>/dev/null || pip3 install --quiet --break-system-packages --retries 1 --timeout 10 autopep8 2>/dev/null || true
          fi

      - name: Format Rust codebase
        run: cargo fmt --all

      - name: Sync Cargo.lock with Cargo.toml
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo update --workspace --offline 2>/dev/null || cargo generate-lockfile 2>/dev/null || true
          fi

      - name: Format C/C++ & GPU Kernel codebase
        run: |
          CLANG_FORMAT_BIN=$(command -v clang-format || command -v clang-format-21 || command -v clang-format-20 || command -v clang-format-19 || command -v clang-format-18 || find /usr/lib/llvm-* -name clang-format -type f -executable 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$CLANG_FORMAT_BIN" ]; then
            EXCLUDE_ARGS=( \( -name target -o -name "build*" -o -name "cmake-build*" -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \) )
            find . "${EXCLUDE_ARGS[@]}" -prune -o \( \
              -name "*.h" -o -name "*.hpp" -o -name "*.inl" -o \
              -name "*.c" -o -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o \
              -name "*.cu" -o -name "*.cuh" -o -name "*.metal" -o -name "*.mm" -o \
              -name "*.comp" -o -name "*.vert" -o -name "*.frag" -o \
              -name "*.glsl" -o -name "*.hlsl" -o -name "*.wgsl" -o -name "*.slang" -o \
              -name "*.hip" -o -name "*.cl" \
            \) -type f -size +0c ! -name ".gitkeep" -exec "$CLANG_FORMAT_BIN" -i {} + 2>/dev/null || true
          fi

      - name: Format Python codebase
        run: |
          EXCLUDE_ARGS=( \( -name target -o -name "build*" -o -name "cmake-build*" -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \) )
          find . "${EXCLUDE_ARGS[@]}" -prune -o -name "*.py" -type f -size +0c -exec autopep8 --in-place --max-line-length 120 {} + 2>/dev/null || true

      - name: Commit formatting changes if needed
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: "style(ci): auto-format codebase before testing [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

  # =========================================================================
  # 2. PATH CHANGED DETECTION
  # =========================================================================
  changes:
    name: Detect Changed Paths
    needs: auto-format
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      dsl: ${{ steps.filter.outputs.dsl }}
      license: ${{ steps.filter.outputs.license }}
      meta: ${{ steps.filter.outputs.meta }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Filter path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cpp:
              - 'include/**'
              - 'src/**'
              - 'examples/**'
              - 'tests/**'
              - 'benches/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - '**/CMakeLists.txt'
              - '**/*.cmake'
              - '**/*.h'
              - '**/*.hpp'
              - '**/*.inl'
              - '**/*.c'
              - '**/*.cpp'
              - '**/*.cc'
              - '**/*.cxx'
              - '**/*.cu'
              - '**/*.cuh'
              - '**/*.metal'
              - '**/*.mm'
              - '**/*.comp'
              - '**/*.vert'
              - '**/*.frag'
              - '**/*.glsl'
              - '**/*.hlsl'
              - '**/*.wgsl'
              - '**/*.slang'
              - '**/*.hip'
              - '**/*.cl'
              - '.clang-format'
              - '.github/workflows/**'
            rust:
              - 'include/**'
              - 'src/**'
              - 'examples/**'
              - 'tests/**'
              - 'benches/**'
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - '**/build.rs'
              - 'Cargo.lock'
              - 'deny.toml'
              - '**/*.rs'
              - '.github/workflows/**'
            python:
              - 'scripts/**'
              - '**/*.py'
              - 'pyproject.toml'
              - 'requirements.txt'
              - '.github/workflows/**'
            dsl:
              - 'src/dsl/**'
              - 'examples/dsl/**'
              - 'tests/dsl/**'
              - '**/*.lmnk'
              - '.github/workflows/**'
            license:
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'LICENSE*'
              - 'src/**'
              - 'include/**'
              - 'scripts/**'
              - 'tests/**'
              - 'examples/**'
              - 'benches/**'
              - 'cmake/**'
              - '**/CMakeLists.txt'
              - '**/build.rs'
              - '.github/workflows/**'
            meta:
              - 'CITATION.cff'
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - '*.md'
              - '**/*.md'
              - '.github/workflows/**'

  # =========================================================================
  # 3. LICENSE & DEPENDENCY SAFETY CHECK (STRICT PERMISSIVE GUARANTEE)
  # =========================================================================
  license-safety-check:
    name: License & Dependency Safety
    needs: [auto-format, changes]
    if: ${{ always() && !cancelled() && (needs.changes.outputs.license == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny check (Licenses, Bans, Advisories, Sources)
        run: |
          if [ -f "deny.toml" ]; then
            cargo deny check
          else
            echo "No deny.toml found; skipping cargo-deny check."
          fi

      - name: Scan Copyleft & Non-Permissive License Keywords
        run: |
          echo "Scanning codebase for strict permissive compliance (blocking Copyleft/Non-Commercial)..."
          EXCLUDE_ARGS=( \( -name target -o -name "build*" -o -name "cmake-build*" -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \) )
          FORBIDDEN_PATTERNS="GPL-1.0|GPL-2.0|GPL-3.0|LGPL-2.1|LGPL-3.0|AGPL-3.0|SSPL-1.0|CC-BY-NC|MPL-1.1|MPL-2.0|EPL-1.0|EPL-2.0|CDDL-1.0|EUPL-1.1|EUPL-1.2|PolyForm|CPAL-1.0|Watcom-1.0"
          FOUND_VIOLATIONS=$(find . "${EXCLUDE_ARGS[@]}" -prune -o -type f -size +0c ! -name "deny.toml" ! -name "ci.yml" ! -name "*.md" -exec grep -E -H -n "$FORBIDDEN_PATTERNS" {} + 2>/dev/null || true)

          if [ -n "$FOUND_VIOLATIONS" ]; then
            echo "Error: Copyleft or non-permissive license keywords detected in codebase:"
            echo "$FOUND_VIOLATIONS"
            exit 1
          fi
          echo "No non-permissive license keywords detected."

      - name: Verify SPDX License Headers in Source Files
        run: |
          echo "Checking SPDX License Headers in non-empty source files..."
          EXCLUDE_ARGS=( \( -name target -o -name "build*" -o -name "cmake-build*" -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \) )
          SLASH_FILES=$(find . "${EXCLUDE_ARGS[@]}" -prune -o \( \
            -name "*.rs" -o -name "*.c" -o -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o \
            -name "*.cu" -o -name "*.cuh" -o -name "*.metal" -o -name "*.mm" -o \
            -name "*.comp" -o -name "*.vert" -o -name "*.frag" -o \
            -name "*.glsl" -o -name "*.hlsl" -o -name "*.wgsl" -o -name "*.slang" -o -name "*.hip" -o -name "*.cl" -o \
            -name "*.h" -o -name "*.hpp" -o -name "*.inl" \
          \) -type f -size +0c ! -name ".gitkeep" -exec grep -L "SPDX-License-Identifier: MIT OR Apache-2.0" {} + 2>/dev/null || true)

          HASH_FILES=$(find . "${EXCLUDE_ARGS[@]}" -prune -o \( \
            -name "*.py" -o -name "*.lmnk" -o -name "*.sh" -o -name "CMakeLists.txt" -o -name "*.cmake" -o \
            -name "*.yml" -o -name "*.yaml" \
          \) -type f -size +0c ! -name ".gitkeep" -exec grep -L "SPDX-License-Identifier: MIT OR Apache-2.0" {} + 2>/dev/null || true)

          MISSING_FILES=""
          if [ -n "$SLASH_FILES" ]; then MISSING_FILES="$SLASH_FILES"; fi
          if [ -n "$HASH_FILES" ]; then MISSING_FILES="$(printf "%s\n%s" "$MISSING_FILES" "$HASH_FILES" | sed '/^$/d')"; fi

          if [ -n "$MISSING_FILES" ]; then
            echo "Error: The following non-empty source files are missing valid SPDX license headers:"
            echo "$MISSING_FILES"
            exit 1
          fi
          echo "All non-empty source files contain valid SPDX headers."

  # =========================================================================
  # 4. C/C++ & GPU KERNELS BUILD MATRIX
  # =========================================================================
  cpp-build-matrix:
    name: C/C++ & GPU Kernels Build (${{ matrix.os }})
    needs: [auto-format, changes]
    if: ${{ always() && !cancelled() && (needs.changes.outputs.cpp == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Build Dependencies & Cache Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v cmake >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1 || ! command -v clang >/dev/null 2>&1 || ! command -v ccache >/dev/null 2>&1 || [ ! -f /usr/include/vulkan/vulkan.h ]; then
            if ! sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 update; then
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null || true
              fi
              sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 update || true
            fi
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 install -y ninja-build clang clang-format cmake libclang-dev ccache vulkan-tools libvulkan-dev glslang-tools libshaderc-dev || true
          fi
          if ! command -v cmake >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
            python3 -m pip install --quiet --retries 1 --timeout 10 cmake ninja 2>/dev/null || pip3 install --quiet --break-system-packages --retries 1 --timeout 10 cmake ninja 2>/dev/null || true
          fi

      - name: Install Build Dependencies & Cache Tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja cmake ccache clang-format || true

      - name: Install Build Dependencies & Cache Tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja ccache llvm --no-progress || true

      - name: Setup Compiler Cache
        if: runner.os != 'Linux' || hashFiles('/usr/bin/ccache', '/usr/local/bin/ccache') != ''
        continue-on-error: true
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-cpp-${{ github.sha }}
          restore-keys: ${{ runner.os }}-cpp-

      - name: Verify C-ABI Header Self-Containment & Layout Static Assertions (C11 & C++20)
        if: runner.os == 'Linux'
        run: |
          echo "Checking C-ABI headers self-containment in include directory..."
          if [ -d "include" ]; then
            HEADERS=$(find include -type f \( -name "*.h" -o -name "*.hpp" \) -size +0c 2>/dev/null || true)
            if [ -n "$HEADERS" ]; then
              C_CC=$(command -v clang || command -v clang-21 || command -v clang-20 || command -v clang-19 || command -v clang-18 || command -v gcc)
              CXX_CC=$(command -v clang++ || command -v clang++-21 || command -v clang++-20 || command -v clang++-19 || command -v clang++-18 || command -v g++)
              for header in $HEADERS; do
                if [[ "$header" == *.h ]]; then
                  echo "Validating strict C11 inclusion for $header with $C_CC..."
                  "$C_CC" -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -fsyntax-only -x c "$header"
                fi
                echo "Validating strict C++20 inclusion for $header with $CXX_CC..."
                "$CXX_CC" -std=c++20 -Wall -Wextra -Wpedantic -Werror -Iinclude -fsyntax-only -x c++ "$header"
              done
            else
              echo "No non-empty header files found under include."
            fi
          else
            echo "Directory include does not exist yet."
          fi

      - name: Configure CMake (Linux with Vulkan & AVX2 enabled)
        if: runner.os == 'Linux'
        run: |
          if [ -f "CMakeLists.txt" ] && command -v cmake >/dev/null 2>&1; then
            CMAKE_EXTRA_ARGS=()
            if command -v ninja >/dev/null 2>&1; then
              CMAKE_EXTRA_ARGS+=(-GNinja)
            fi
            if command -v ccache >/dev/null 2>&1; then
              CMAKE_EXTRA_ARGS+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
            fi
            VULKAN_FLAG="OFF"
            if [ -f "/usr/include/vulkan/vulkan.h" ] || [ -f "/usr/local/include/vulkan/vulkan.h" ] || [ -n "${VULKAN_SDK:-}" ]; then
              VULKAN_FLAG="ON"
            fi
            cmake -B build -S . "${CMAKE_EXTRA_ARGS[@]}" \
              -DLIMINIKA_ENABLE_VULKAN="${VULKAN_FLAG}" \
              -DLIMINIKA_ENABLE_AVX2=ON \
              -DLIMINIKA_ENABLE_CUDA=OFF \
              -DLIMINIKA_ENABLE_METAL=OFF \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
          else
            echo "No root CMakeLists.txt or cmake binary found; skipping CMake configure."
          fi

      - name: Configure CMake (Windows with AVX2 enabled)
        if: runner.os == 'Windows'
        run: |
          if [ -f "CMakeLists.txt" ]; then
            cmake -B build -S . -GNinja \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DLIMINIKA_ENABLE_AVX2=ON \
              -DLIMINIKA_ENABLE_CUDA=OFF \
              -DLIMINIKA_ENABLE_VULKAN=OFF \
              -DLIMINIKA_ENABLE_METAL=OFF \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
          else
            echo "No root CMakeLists.txt found; skipping CMake configure."
          fi

      - name: Configure CMake (macOS with Metal & NEON enabled)
        if: runner.os == 'macOS'
        run: |
          if [ -f "CMakeLists.txt" ]; then
            cmake -B build -S . -GNinja \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DLIMINIKA_ENABLE_METAL=ON \
              -DLIMINIKA_ENABLE_NEON=ON \
              -DLIMINIKA_ENABLE_CUDA=OFF \
              -DLIMINIKA_ENABLE_VULKAN=OFF \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
          else
            echo "No root CMakeLists.txt found; skipping CMake configure."
          fi

      - name: Build C/C++ targets
        run: |
          if [ -d "build" ]; then
            cmake --build build
          else
            echo "Build directory does not exist; skipping build step."
          fi

      - name: Run C/C++ unit tests
        run: |
          if [ -d "build" ]; then
            if [ "$RUNNER_OS" != "Windows" ]; then
              ulimit -s 16384 || true
            fi
            ctest --test-dir build --output-on-failure --no-tests=ignore
          else
            echo "Build directory does not exist; skipping test execution."
          fi

  # =========================================================================
  # 5. RUST WORKSPACE CHECK & TEST MATRIX
  # =========================================================================
  rust-check-matrix:
    name: Rust Workspace (${{ matrix.os }})
    needs: [auto-format, changes]
    if: ${{ always() && !cancelled() && (needs.changes.outputs.rust == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install C/C++ & LLVM Dependencies for FFI/Bindgen (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v cmake >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1 || ! command -v clang >/dev/null 2>&1 || [ ! -f /usr/include/vulkan/vulkan.h ]; then
            if ! sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 update; then
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null || true
              fi
              sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 update || true
            fi
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 install -y cmake ninja-build libclang-dev clang libvulkan-dev glslang-tools libshaderc-dev || true
          fi
          if ! command -v cmake >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
            python3 -m pip install --quiet --retries 1 --timeout 10 cmake ninja 2>/dev/null || pip3 install --quiet --break-system-packages --retries 1 --timeout 10 cmake ninja 2>/dev/null || true
          fi

      - name: Install C/C++ & LLVM Dependencies for FFI/Bindgen (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja llvm || true
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV

      - name: Install C/C++ & LLVM Dependencies for FFI/Bindgen (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja llvm --no-progress || true
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $GITHUB_ENV
          echo "LLVM_CONFIG_PATH=C:\Program Files\LLVM\bin\llvm-config.exe" >> $GITHUB_ENV
          echo "C:\Program Files\LLVM\bin" >> $GITHUB_PATH

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      - name: Fast check Rust workspace (Linux with Vulkan enabled)
        if: runner.os == 'Linux'
        run: |
          if [ -f "Cargo.toml" ]; then
            if [ -f "/usr/include/vulkan/vulkan.h" ] || [ -f "/usr/local/include/vulkan/vulkan.h" ] || [ -n "${VULKAN_SDK:-}" ]; then
              export LIMINIKA_ENABLE_VULKAN="1"
            else
              export LIMINIKA_ENABLE_VULKAN="0"
            fi
            CARGO_FLAGS=""
            if cargo check --workspace --all-targets --locked 2>/dev/null; then
              CARGO_FLAGS="--locked"
            else
              echo "Warning: Cargo.lock is out of sync with Cargo.toml. Running without --locked..."
            fi
            cargo check --workspace --all-targets $CARGO_FLAGS
            cargo check --workspace --all-targets --no-default-features $CARGO_FLAGS
            cargo check --workspace --all-targets --all-features $CARGO_FLAGS
          else
            echo "No root Cargo.toml found; skipping cargo check."
          fi

      - name: Fast check Rust workspace (macOS with Metal enabled)
        if: runner.os == 'macOS'
        env:
          LIMINIKA_ENABLE_METAL: "1"
          LIMINIKA_ENABLE_VULKAN: "0"
        run: |
          if [ -f "Cargo.toml" ]; then
            CARGO_FLAGS=""
            if cargo check --workspace --all-targets --locked 2>/dev/null; then
              CARGO_FLAGS="--locked"
            else
              echo "Warning: Cargo.lock is out of sync with Cargo.toml. Running without --locked..."
            fi
            cargo check --workspace --all-targets $CARGO_FLAGS
            cargo check --workspace --all-targets --no-default-features $CARGO_FLAGS
            cargo check --workspace --all-targets --all-features $CARGO_FLAGS
          else
            echo "No root Cargo.toml found; skipping cargo check."
          fi

      - name: Fast check Rust workspace (Windows)
        if: runner.os == 'Windows'
        env:
          LIMINIKA_ENABLE_VULKAN: "0"
        run: |
          if [ -f "Cargo.toml" ]; then
            CARGO_FLAGS=""
            if cargo check --workspace --all-targets --locked 2>/dev/null; then
              CARGO_FLAGS="--locked"
            else
              echo "Warning: Cargo.lock is out of sync with Cargo.toml. Running without --locked..."
            fi
            cargo check --workspace --all-targets $CARGO_FLAGS
            cargo check --workspace --all-targets --no-default-features $CARGO_FLAGS
            cargo check --workspace --all-targets --all-features $CARGO_FLAGS
          else
            echo "No root Cargo.toml found; skipping cargo check."
          fi

      - name: Run cargo clippy (default, no_std, and all-features)
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo clippy --workspace --all-targets --no-default-features -- -D warnings
            cargo clippy --workspace --all-targets -- -D warnings
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          fi

      - name: Run cargo clippy & AVX2/FMA SIMD verification (x86_64 Linux)
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: "-C target-feature=+avx2,+fma"
        run: |
          if [ -f "Cargo.toml" ]; then
            ulimit -s 16384 || true
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo nextest run --workspace --lib --bins --tests --all-features
          fi

      - name: Check Rust documentation integrity (Ubuntu only)
        if: runner.os == 'Linux' && hashFiles('Cargo.toml') != ''
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

      - name: Run Rust workspace unit, integration, & zero-alloc tests via nextest
        run: |
          if [ -f "Cargo.toml" ]; then
            if [ "$RUNNER_OS" != "Windows" ]; then
              ulimit -s 16384 || true
            fi
            cargo test --workspace --doc --all-features
            cargo nextest run --workspace --all-targets --all-features
          fi

  # =========================================================================
  # 6. DSL SPEC & EXAMPLES VALIDATION
  # =========================================================================
  dsl-validation:
    name: Validate DSL Spec & Examples
    needs: [auto-format, changes]
    if: ${{ always() && !cancelled() && (needs.changes.outputs.dsl == 'true' || needs.changes.outputs.rust == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      - name: Build DSL package & CLI parser
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo build --workspace
          fi

      - name: Validate Example DSL files
        run: |
          echo "Validating DSL files in repository..."
          EXCLUDE_ARGS=( \( -name target -o -name "build*" -o -name "cmake-build*" -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \) )
          DSL_FILES=$(find . "${EXCLUDE_ARGS[@]}" -prune -o -name "*.lmnk" -type f -print 2>/dev/null || true)
          if [ -n "$DSL_FILES" ]; then
            for file in $DSL_FILES; do
              echo "Checking $file..."
              if [ -f "Cargo.toml" ] && cargo metadata --format-version 1 2>/dev/null | grep -qE '"name":"(liminika-cli|liminika)"'; then
                cargo run --workspace -- check "$file" || echo "CLI check command completed for $file"
              fi
            done
          fi

  # =========================================================================
  # 7. PYTHON SCRIPT SYNTAX & CLI VERIFICATION
  # =========================================================================
  python-check:
    name: Python Script Syntax Verification
    needs: [auto-format, changes]
    if: ${{ always() && !cancelled() && (needs.changes.outputs.python == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python Syntax, CLI Smoke Checks & Unit Tests
        run: |
          echo "Verifying Python syntax..."
          EXCLUDE_ARGS=( \( -name target -o -name "build*" -o -name "cmake-build*" -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache \) )
          PY_FILES=$(find . "${EXCLUDE_ARGS[@]}" -prune -o -name "*.py" -type f -print 2>/dev/null || true)
          if [ -n "$PY_FILES" ]; then
            echo "$PY_FILES" | xargs python -m py_compile
            echo "All Python scripts passed syntax validation."
          fi

          if [ -f "scripts/generate_bench_report.py" ]; then
            python scripts/generate_bench_report.py --help >/dev/null
          fi
          if [ -f "scripts/run_benchmarks.py" ]; then
            python scripts/run_benchmarks.py --help >/dev/null
          fi

          if [ -d "tests" ]; then
            PY_TEST_FILES=$(find tests -type f \( -name "test_*.py" -o -name "*_test.py" \) 2>/dev/null || true)
            if [ -n "$PY_TEST_FILES" ]; then
              python -m unittest discover -s tests
            fi
          fi

  # =========================================================================
  # 8. META & CITATION VALIDATION
  # =========================================================================
  meta-citation-check:
    name: Validate Meta & Citation Files
    needs: [auto-format, changes]
    if: ${{ always() && !cancelled() && (needs.changes.outputs.meta == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cffconvert & Validate CITATION.cff Schema
        run: |
          if [ -f "CITATION.cff" ]; then
            python -m pip install --quiet --retries 1 --timeout 10 --upgrade pip cffconvert || true
            if command -v cffconvert >/dev/null 2>&1; then
              cffconvert --validate
            fi
          fi

  # =========================================================================
  # 9. DOCUMENTATION INTEGRITY & LINK CHECK
  # =========================================================================
  docs-check:
    name: Documentation Integrity & Link Check
    needs: [auto-format, changes]
    if: ${{ always() && !cancelled() && (needs.changes.outputs.docs == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Check markdown broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --offline --exclude ".*target/criterion.*" '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}