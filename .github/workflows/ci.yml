name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  # ---------------------------------------------------------------------------
  # 1. Rust Code Quality, Lints & Tests
  # ---------------------------------------------------------------------------
  rust-ci:
    name: Rust (Formatting, Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C/C++ build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ccache

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build Rust workspace
        run: cargo build --workspace --all-targets

      - name: Run Rust tests
        run: cargo test --workspace --all-targets

  # ---------------------------------------------------------------------------
  # 2. License & IP Security Checks (Integrated Cargo Deny)
  # ---------------------------------------------------------------------------
  license-and-advisories:
    name: License & Dependency Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Rust licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check

  # ---------------------------------------------------------------------------
  # 3. C/C++ Core & Kernels Build & Formatting
  # ---------------------------------------------------------------------------
  cpp-ci:
    name: C/C++ Build & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C/C++ toolchain dependencies and ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang-format ccache

      - name: Setup ccache for C/C++ compilation
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-cpp-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-cpp-ccache-

      - name: Check C/C++ code formatting (.clang-format)
        run: |
          TARGET_DIRS="include src/core src/kernels examples tests"
          EXISTING_DIRS=""
          for d in $TARGET_DIRS; do
            if [ -d "$d" ]; then
              EXISTING_DIRS="$EXISTING_DIRS $d"
            fi
          done
          if [ -n "$EXISTING_DIRS" ]; then
            find $EXISTING_DIRS -type f \( -name "*.h" -o -name "*.hpp" -o -name "*.c" -o -name "*.cpp" -o -name "*.cu" \) \
              ! -name ".gitkeep" -print0 2>/dev/null | xargs -0 -r clang-format --dry-run --Werror
          fi

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLIMINIKA_BUILD_TESTS=ON \
            -DLIMINIKA_ENABLE_CUDA=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_COMPILE_WARNINGS_AS_ERRORS=ON

      - name: Build C/C++ components
        run: cmake --build build --config Debug

      - name: Run C/C++ tests (CTest)
        run: ctest --test-dir build --output-on-failure -C Debug --no-tests=pass

  # ---------------------------------------------------------------------------
  # 4. Validation for Citation & Meta Files
  # ---------------------------------------------------------------------------
  meta-val:
    name: Validate Meta & Citation Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@v2.0.0
        with:
          args: "--validate"