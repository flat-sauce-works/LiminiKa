# name: .github/workflows/ci.yml
# SPDX-License-Identifier: MIT OR Apache-2.0

name: CI Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUST_MIN_STACK: "16777216"
  CARGO_TERM_COLOR: always

jobs:
  # =========================================================================
  # 1. PATH CHANGED DETECTION
  # =========================================================================
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      dsl: ${{ steps.filter.outputs.dsl }}
      license: ${{ steps.filter.outputs.license }}
      meta: ${{ steps.filter.outputs.meta }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Filter path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cpp:
              - 'include/**'
              - 'src/core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'examples/c_api/**'
              - 'examples/CMakeLists.txt'
              - 'tests/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - '**/CMakeLists.txt'
              - '**/*.cmake'
              - '**/*.h'
              - '**/*.hpp'
              - '**/*.inl'
              - '**/*.c'
              - '**/*.cpp'
              - '**/*.cc'
              - '**/*.cxx'
              - '.clang-format'
              - '.github/workflows/**'
            rust:
              - 'include/**'
              - 'src/**'
              - 'examples/**'
              - 'tests/**'
              - 'benches/**'
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.lock'
              - 'deny.toml'
              - '**/*.rs'
              - '.github/workflows/**'
            python:
              - 'scripts/**'
              - '**/*.py'
              - 'pyproject.toml'
              - 'requirements.txt'
              - '.github/workflows/**'
            dsl:
              - 'src/dsl/**'
              - 'examples/dsl/**'
              - 'tests/dsl/**'
              - '**/*.lmnk'
              - '.github/workflows/**'
            license:
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.lock'
              - 'deny.toml'
              - 'LICENSE*'
              - 'src/**'
              - 'include/**'
              - 'scripts/**'
              - 'tests/**'
              - 'examples/**'
              - 'benches/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - '**/CMakeLists.txt'
              - '.clang-format'
              - '.editorconfig'
              - '.gitignore'
              - '.gitattributes'
              - '.github/workflows/**'
            meta:
              - 'CITATION.cff'
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - '*.md'
              - '**/*.md'
              - '.github/workflows/**'

  # =========================================================================
  # 2. CONDITIONAL AUTO-FORMAT & LF NORMALIZATION BEFORE TESTING
  # =========================================================================
  auto-format:
    name: Auto-Format & Normalize Line Endings
    needs: changes
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      formatted_sha: ${{ steps.record_sha.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Record base commit SHA
        id: base_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Normalize tracked text files to LF
        run: |
          python3 - << 'PY'
          import pathlib
          import subprocess

          raw_list = subprocess.check_output(["git", "ls-files", "-z"])
          converted = 0
          for entry in raw_list.split(b"\0"):
              if not entry:
                  continue
              rel = entry.decode("utf-8")
              p = pathlib.Path(rel)
              if p.suffix.lower() in {".bat", ".cmd"} or not p.is_file():
                  continue
              data = p.read_bytes()
              if b"\x00" in data or b"\r\n" not in data:
                  continue
              p.write_bytes(data.replace(b"\r\n", b"\n"))
              converted += 1
          print(f"Normalized {converted} tracked text file(s) from CRLF to LF.")
          PY
          git add --renormalize .

      - name: Install Rust toolchain (if Rust changed)
        if: ${{ needs.changes.outputs.rust == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust codebase & sync Cargo.lock
        if: ${{ needs.changes.outputs.rust == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        run: |
          cargo fmt --all
          if [ -f "examples/candle_eval/Cargo.toml" ]; then
            cargo fmt --manifest-path examples/candle_eval/Cargo.toml
          fi
          if [ -f "Cargo.toml" ]; then
            cargo update --workspace --offline 2>/dev/null || true
          fi
          if [ -f "examples/candle_eval/Cargo.toml" ]; then
            cargo update --manifest-path examples/candle_eval/Cargo.toml --workspace --offline 2>/dev/null || true
          fi

      - name: Format C/C++ codebase
        if: ${{ needs.changes.outputs.cpp == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        run: |
          if ! command -v clang-format >/dev/null 2>&1; then
            if ! sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 update; then
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null || true
              fi
              sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 update || true
            fi
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 install -y clang-format || true
          fi
          CLANG_FORMAT_BIN=$(command -v clang-format || command -v clang-format-21 || command -v clang-format-20 || command -v clang-format-19 || command -v clang-format-18 || find /usr/lib/llvm-* -name clang-format -type f -executable 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$CLANG_FORMAT_BIN" ]; then
            EXCLUDE_ARGS=( \( -name target -o -name "build*" -o -name "cmake-build*" -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name .scratch -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache -o -name models -o -name containers \) )
            find . "${EXCLUDE_ARGS[@]}" -prune -o \( \
              -name "*.h" -o -name "*.hpp" -o -name "*.inl" -o \
              -name "*.c" -o -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" \
            \) -type f -size +0c ! -name ".gitkeep" -exec "$CLANG_FORMAT_BIN" -i {} + 2>/dev/null || true
          fi

      - name: Format Python codebase
        if: ${{ needs.changes.outputs.python == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        run: |
          if ! command -v autopep8 >/dev/null 2>&1; then
            python3 -m pip install --quiet --retries 1 --timeout 10 autopep8 2>/dev/null || pip3 install --quiet --break-system-packages --retries 1 --timeout 10 autopep8 2>/dev/null || true
          fi
          if command -v autopep8 >/dev/null 2>&1; then
            EXCLUDE_ARGS=( \( -name target -o -name "build*" -o -name "cmake-build*" -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name .scratch -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache -o -name models -o -name containers \) )
            find . "${EXCLUDE_ARGS[@]}" -prune -o -name "*.py" -type f -size +0c -exec autopep8 --in-place --max-line-length 120 {} + 2>/dev/null || true
          fi

      - name: Commit formatting changes if needed
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: "style(ci): auto-format and normalize line endings before testing [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Record formatted commit SHA
        id: record_sha
        run: |
          NEW_SHA=$(git rev-parse HEAD)
          if [ "${{ steps.auto_commit.outcome }}" = "success" ] && [ "$NEW_SHA" != "${{ steps.base_sha.outputs.sha }}" ]; then
            echo "sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

  # =========================================================================
  # 3. LICENSE & DEPENDENCY SAFETY CHECK (STRICT PERMISSIVE GUARANTEE)
  # =========================================================================
  license-safety-check:
    name: License & Dependency Safety
    needs: [changes, auto-format]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && (needs.auto-format.result == 'success' || needs.auto-format.result == 'skipped') && (needs.changes.outputs.license == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-format.outputs.formatted_sha || '' }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny check (Licenses, Bans, Advisories, Sources)
        run: |
          if [ -f "deny.toml" ]; then
            cargo deny check
          else
            echo "No deny.toml found; skipping cargo-deny check."
          fi

      - name: Scan Copyleft & Non-Permissive License Keywords
        run: |
          echo "Scanning codebase for strict permissive compliance (blocking Copyleft/Non-Commercial)..."
          EXCLUDE_ARGS=( \( -name target -o -name "build*" -o -name "cmake-build*" -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name .scratch -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache -o -name models -o -name containers \) )
          FORBIDDEN_PATTERNS="GPL-1.0|GPL-2.0|GPL-3.0|LGPL-2.1|LGPL-3.0|AGPL-3.0|SSPL-1.0|CC-BY-NC|MPL-1.1|MPL-2.0|EPL-1.0|EPL-2.0|CDDL-1.0|EUPL-1.1|EUPL-1.2|PolyForm|CPAL-1.0|Watcom-1.0"
          FOUND_VIOLATIONS=$(find . "${EXCLUDE_ARGS[@]}" -prune -o -type f -size +0c ! -name "deny.toml" ! -name "ci.yml" ! -name "*.md" -exec grep -E -H -n "$FORBIDDEN_PATTERNS" {} + 2>/dev/null || true)

          if [ -n "$FOUND_VIOLATIONS" ]; then
            echo "Error: Copyleft or non-permissive license keywords detected in codebase:"
            echo "$FOUND_VIOLATIONS"
            exit 1
          fi
          echo "No non-permissive license keywords detected."

      - name: Verify Index LF Line Endings (No i/crlf)
        run: |
          python3 - << 'PY'
          import pathlib
          import subprocess
          import sys

          out = subprocess.check_output(["git", "ls-files", "--eol"], text=True)
          bad = []
          for line in out.splitlines():
              if "\t" not in line:
                  continue
              meta, rel = line.split("\t", 1)
              if pathlib.Path(rel).suffix.lower() in {".bat", ".cmd"}:
                  continue
              tokens = meta.split()
              if tokens and tokens[0] in {"i/crlf", "i/mixed"}:
                  bad.append(f"{tokens[0]} {rel}")

          if bad:
              print("Error: Tracked text files with CRLF/mixed line endings in git index:", *bad, sep="\n  ")
              sys.exit(1)
          print("All tracked non-batch files have LF line endings in the git index.")
          PY

      - name: Verify Mandatory Two-Line File Headers & SPDX Compliance
        run: |
          python3 - << 'PY'
          import pathlib
          import sys

          exclude = {
              "target", "build", "cmake-build", "_build", ".git", ".cargo",
              ".venv", ".scratch", "node_modules", "vendor", "third_party", "3rdparty",
              "__pycache__", ".cache", "models", "containers",
              ".agent", ".agents", ".antigravity", ".gemini", ".idx", ".vscode", ".idea",
          }
          slash_exts = {
              ".rs", ".c", ".cpp", ".cc", ".cxx", ".h", ".hpp", ".inl",
              ".cu", ".cuh", ".metal", ".mm", ".comp", ".vert", ".frag",
              ".glsl", ".hlsl", ".wgsl", ".slang", ".hip", ".cl", ".lmnk",
          }
          hash_exts = {".py", ".sh", ".cmake", ".yml", ".yaml"}
          hash_names = {
              "Cargo.toml", "CMakeLists.txt", "deny.toml",
              ".clang-format", ".editorconfig", ".gitignore", ".gitattributes",
          }

          missing_header = []
          missing_spdx = []

          for p in sorted(pathlib.Path(".").rglob("*")):
              if not p.is_file() or any(part in exclude or part.startswith("build-") or part.startswith("cmake-build") for part in p.parts):
                  continue
              if p.name == ".gitkeep" or p.stat().st_size == 0:
                  continue
              if p.suffix in slash_exts:
                  prefix = "//"
              elif p.suffix in hash_exts or p.name in hash_names:
                  prefix = "#"
              else:
                  continue

              lines = p.read_text(encoding="utf-8", errors="replace").splitlines()
              rel = p.as_posix()
              expected_line1 = f"{prefix} name: {rel}"
              if not lines or lines[0].rstrip() != expected_line1:
                  missing_header.append(f"{rel} (got {lines[0]!r}, expected {expected_line1!r})" if lines else rel)
              if len(lines) < 2 or "SPDX-License-Identifier: MIT OR Apache-2.0" not in lines[1]:
                  missing_spdx.append(rel)

          if missing_header or missing_spdx:
              if missing_header:
                  print("Error: Missing or mismatched line-1 file header:", *missing_header, sep="\n  ")
              if missing_spdx:
                  print("Error: Missing SPDX header on line 2:", *missing_spdx, sep="\n  ")
              sys.exit(1)
          print("All source and config files passed two-line header and SPDX checks.")
          PY

      - name: Verify Cross-File Version & C-ABI Constant Parity
        run: |
          python3 - << 'PY'
          import pathlib
          import re
          import sys

          def read(path):
              return pathlib.Path(path).read_text(encoding="utf-8")

          def must_match(pattern, text, label):
              m = re.search(pattern, text)
              if m is None:
                  print(f"Error: Version parity pattern not found for {label}: {pattern}")
                  sys.exit(1)
              return m

          ver = must_match(r'(?m)^version\s*=\s*"([^"]+)"', read("Cargo.toml"), "Cargo.toml version").group(1)
          candle_ver = must_match(r'(?m)^version\s*=\s*"([^"]+)"', read("examples/candle_eval/Cargo.toml"), "examples/candle_eval/Cargo.toml version").group(1)
          root_cmake = must_match(r'project\(LiminiKa\s+VERSION\s+(\d+\.\d+\.\d+)', read("CMakeLists.txt"), "CMakeLists.txt project VERSION").group(1)

          types_h = read("include/liminika/lmnk_types.h")
          abi_h = read("include/liminika/lmnk_abi.h")
          c_maj = int(must_match(r'#define\s+LMNK_ABI_VERSION_MAJOR\s+(\d+)U', types_h, "lmnk_types.h MAJOR").group(1))
          c_min = int(must_match(r'#define\s+LMNK_ABI_VERSION_MINOR\s+(\d+)U', types_h, "lmnk_types.h MINOR").group(1))
          c_pat = int(must_match(r'#define\s+LMNK_ABI_VERSION_PATCH\s+(\d+)U', types_h, "lmnk_types.h PATCH").group(1))
          c_str = must_match(r'#define\s+LMNK_ABI_VERSION_STRING\s+"([^"]+)"', types_h, "lmnk_types.h STRING").group(1)
          c_anchor_hex = int(must_match(r'#define\s+LMNK_PHASE_ANCHOR_VERSION\s+(0x[0-9A-Fa-f]+)U?', types_h, "lmnk_types.h LMNK_PHASE_ANCHOR_VERSION").group(1), 16)

          constants_rs = read("src/core/src/liminal/constants.rs")
          r_maj = int(must_match(r'pub\s+const\s+LMNK_ABI_VERSION_MAJOR:\s*u32\s*=\s*(\d+)', constants_rs, "liminal/constants.rs MAJOR").group(1))
          r_min = int(must_match(r'pub\s+const\s+LMNK_ABI_VERSION_MINOR:\s*u32\s*=\s*(\d+)', constants_rs, "liminal/constants.rs MINOR").group(1))
          r_pat = int(must_match(r'pub\s+const\s+LMNK_ABI_VERSION_PATCH:\s*u32\s*=\s*(\d+)', constants_rs, "liminal/constants.rs PATCH").group(1))
          r_cstr = must_match(r'pub\s+const\s+LMNK_ABI_VERSION_CSTR:[^=]*=\s*c"([^"]+)"', constants_rs, "liminal/constants.rs CSTR").group(1)
          abi_types_rs = read("src/core/src/runtime/abi/types.rs")

          parts = tuple(int(x) for x in ver.split("."))
          expected_hex = (parts[0] << 16) | (parts[1] << 8) | parts[2]

          checks = [
              ("examples/candle_eval/Cargo.toml", candle_ver == ver),
              ("CMakeLists.txt", root_cmake == ver),
              ("lmnk_types.h tuple", (c_maj, c_min, c_pat) == parts),
              ("lmnk_types.h string", c_str == ver),
              ("lmnk_types.h anchor hex", c_anchor_hex == expected_hex),
              ("lmnk_abi.h includes lmnk_types.h", '#include "lmnk_types.h"' in abi_h),
              ("liminal/constants.rs tuple", (r_maj, r_min, r_pat) == parts),
              ("liminal/constants.rs cstr", r_cstr == ver),
              ("runtime/abi/types.rs re-export", "LMNK_ABI_VERSION_MAJOR" in abi_types_rs and "LMNK_ABI_VERSION_CSTR" in abi_types_rs),
          ]
          failed = [name for name, ok in checks if not ok]
          if failed:
              print("Version parity check failed:", failed)
              sys.exit(1)
          print(f"All manifests, C headers, CMake files, and Rust ABI constants match version {ver} ({hex(expected_hex)}).")
          PY

      - name: Verify 5-Layer Unidirectional DAG, Driver Isolation & Axiom Orthogonality
        run: python3 scripts/verify_architecture.py --check

  # =========================================================================
  # 4. C/C++ FFI & CTEST BUILD MATRIX
  # =========================================================================
  cpp-build-matrix:
    name: C/C++ FFI & CTest Matrix (${{ matrix.os }})
    needs: [changes, auto-format]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && (needs.auto-format.result == 'success' || needs.auto-format.result == 'skipped') && (needs.changes.outputs.cpp == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-format.outputs.formatted_sha || '' }}

      - name: Setup MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Build Dependencies & Cache Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v cmake >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1 || ! command -v clang >/dev/null 2>&1 || ! command -v ccache >/dev/null 2>&1; then
            if ! sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 update; then
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null || true
              fi
              sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 update || true
            fi
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=5 -o Acquire::https::Timeout=5 install -y ninja-build clang clang-format cmake ccache || true
          fi
          if ! command -v cmake >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
            python3 -m pip install --quiet --retries 1 --timeout 10 cmake ninja 2>/dev/null || pip3 install --quiet --break-system-packages --retries 1 --timeout 10 cmake ninja 2>/dev/null || true
          fi

      - name: Install Build Dependencies & Cache Tools (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v ninja >/dev/null 2>&1 || ! command -v cmake >/dev/null 2>&1 || ! command -v ccache >/dev/null 2>&1 || ! command -v clang-format >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja cmake ccache clang-format || true
          fi

      - name: Install Build Dependencies & Cache Tools (Windows)
        if: runner.os == 'Windows'
        run: |
          PKGS=()
          command -v ninja >/dev/null 2>&1 || PKGS+=(ninja)
          command -v ccache >/dev/null 2>&1 || PKGS+=(ccache)
          if [ "${#PKGS[@]}" -gt 0 ]; then
            choco install "${PKGS[@]}" --no-progress || true
          fi

      - name: Setup Compiler Cache
        if: runner.os != 'Linux' || hashFiles('/usr/bin/ccache', '/usr/local/bin/ccache') != ''
        continue-on-error: true
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-cpp-${{ github.sha }}
          restore-keys: ${{ runner.os }}-cpp-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2
        with:
          key: cpp-ffi-${{ runner.os }}

      - name: Build Rust liminika-core staticlib (Unix)
        if: runner.os != 'Windows'
        run: cargo build --locked --release -p liminika-core

      - name: Build Rust liminika-core staticlib (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked --release -p liminika-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify C-ABI Header Self-Containment & Layout Static Assertions (Unix C11 & C++20)
        if: runner.os != 'Windows'
        run: |
          echo "Checking C-ABI headers self-containment in include directory..."
          HEADERS=$(find include -type f \( -name "*.h" -o -name "*.hpp" \) -size +0c | sort)
          if [ -z "$HEADERS" ]; then
            echo "Error: No headers found under include/"
            exit 1
          fi
          C_CC=$(command -v clang || command -v clang-21 || command -v clang-20 || command -v clang-19 || command -v clang-18 || command -v gcc)
          CXX_CC=$(command -v clang++ || command -v clang++-21 || command -v clang++-20 || command -v clang++-19 || command -v clang++-18 || command -v g++)
          for header in $HEADERS; do
            if [[ "$header" == *.h ]]; then
              echo "Validating strict C11 inclusion for $header with $C_CC..."
              "$C_CC" -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -fsyntax-only -x c "$header"
            fi
            echo "Validating strict C++20 inclusion for $header with $CXX_CC..."
            "$CXX_CC" -std=c++20 -Wall -Wextra -Wpedantic -Werror -Iinclude -fsyntax-only -x c++ "$header"
          done

      - name: Verify C-ABI Header Self-Containment & Layout Static Assertions (Windows C11 & C++20)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host "Checking C-ABI headers self-containment in include directory with MSVC..."
          $headers = Get-ChildItem -Path include -Recurse -File |
            Where-Object { ($_.Extension -in @('.h', '.hpp')) -and $_.Length -gt 0 } |
            Sort-Object FullName
          if (-not $headers) {
            Write-Error "Error: No headers found under include/"
            exit 1
          }
          foreach ($header in $headers) {
            if ($header.Extension -eq '.h') {
              Write-Host "Validating strict C11 inclusion for $($header.FullName) with cl.exe..."
              cl.exe /nologo /Zs /std:c11 /TC /W4 /WX /wd4324 /utf-8 /Zc:preprocessor /Iinclude "$($header.FullName)"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            Write-Host "Validating strict C++20 inclusion for $($header.FullName) with cl.exe..."
            cl.exe /nologo /Zs /std:c++20 /TP /W4 /WX /wd4324 /permissive- /utf-8 /Zc:preprocessor /Iinclude "$($header.FullName)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Configure CMake (Linux with AVX2 enabled)
        if: runner.os == 'Linux'
        run: |
          if [ -f "CMakeLists.txt" ] && command -v cmake >/dev/null 2>&1; then
            CMAKE_EXTRA_ARGS=()
            if command -v ninja >/dev/null 2>&1; then
              CMAKE_EXTRA_ARGS+=(-GNinja)
            fi
            if command -v ccache >/dev/null 2>&1; then
              CMAKE_EXTRA_ARGS+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
            fi
            cmake -B build -S . "${CMAKE_EXTRA_ARGS[@]}" \
              -DLIMINIKA_ENABLE_AVX2=ON \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
          else
            echo "No root CMakeLists.txt or cmake binary found; skipping CMake configure."
          fi

      - name: Configure CMake (Windows with AVX2 enabled)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((Test-Path "CMakeLists.txt") -and (Get-Command cmake -ErrorAction SilentlyContinue)) {
            $cmakeArgs = @()
            if (Get-Command ninja -ErrorAction SilentlyContinue) {
              $cmakeArgs += "-GNinja"
            }
            if (Get-Command ccache -ErrorAction SilentlyContinue) {
              $cmakeArgs += @(
                "-DCMAKE_C_COMPILER_LAUNCHER=ccache",
                "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
                "-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded",
                "-DCMAKE_POLICY_DEFAULT_CMP0141=NEW"
              )
            }
            cmake -B build -S . @cmakeArgs -DLIMINIKA_ENABLE_AVX2=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "No root CMakeLists.txt or cmake binary found; skipping CMake configure."
          }

      - name: Configure CMake (macOS with NEON enabled)
        if: runner.os == 'macOS'
        run: |
          if [ -f "CMakeLists.txt" ] && command -v cmake >/dev/null 2>&1; then
            CMAKE_EXTRA_ARGS=()
            if command -v ninja >/dev/null 2>&1; then
              CMAKE_EXTRA_ARGS+=(-GNinja)
            fi
            if command -v ccache >/dev/null 2>&1; then
              CMAKE_EXTRA_ARGS+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
            fi
            cmake -B build -S . "${CMAKE_EXTRA_ARGS[@]}" \
              -DLIMINIKA_ENABLE_NEON=ON \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
          else
            echo "No root CMakeLists.txt or cmake binary found; skipping CMake configure."
          fi

      - name: Build C/C++ targets (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ -d "build" ]; then
            cmake --build build --parallel
          else
            echo "Build directory does not exist; skipping build step."
          fi

      - name: Build C/C++ targets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path "build") {
            cmake --build build --parallel
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Build directory does not exist; skipping build step."
          }

      - name: Run C/C++ unit tests (Unix)
        if: runner.os != 'Windows'
        run: |
          ulimit -s 16384 || true
          ctest --test-dir build --output-on-failure --no-tests=error

      - name: Run C/C++ unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ctest --test-dir build --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build & Run C/C++ Smoke Tests with ASan + UBSan (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build-asan -S . -GNinja \
            -DLIMINIKA_ENABLE_AVX2=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-asan --parallel
          ulimit -s 16384 || true
          ctest --test-dir build-asan --output-on-failure --no-tests=error

  # =========================================================================
  # 5. RUST WORKSPACE CHECK & TEST MATRIX
  # =========================================================================
  rust-check-matrix:
    name: Rust Workspace (${{ matrix.os }})
    needs: [changes, auto-format]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && (needs.auto-format.result == 'success' || needs.auto-format.result == 'skipped') && (needs.changes.outputs.rust == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-format.outputs.formatted_sha || '' }}

      - name: Setup MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/candle_eval -> examples/candle_eval/target

      - name: Verify Rust formatting (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          if [ -f "examples/candle_eval/Cargo.toml" ]; then
            cargo fmt --manifest-path examples/candle_eval/Cargo.toml -- --check
          fi

      - name: Run cargo check/clippy (no_std core, default, and all-features) (Unix)
        if: runner.os != 'Windows'
        run: |
          cargo metadata --format-version 1 --locked >/dev/null
          cargo rustc --locked -p liminika-core --no-default-features --lib --crate-type rlib -- -D warnings
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run cargo check/clippy (no_std core, default, and all-features) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo metadata --format-version 1 --locked > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo rustc --locked -p liminika-core --no-default-features --lib --crate-type rlib -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check & test standalone examples/candle_eval crate (Unix)
        if: runner.os != 'Windows'
        run: |
          cargo clippy --locked --manifest-path examples/candle_eval/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path examples/candle_eval/Cargo.toml

      - name: Check & test standalone examples/candle_eval crate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo clippy --locked --manifest-path examples/candle_eval/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path examples/candle_eval/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run cargo clippy & AVX2/FMA SIMD verification (x86_64 Linux)
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: "-C target-feature=+avx2,+fma"
        run: |
          ulimit -s 16384 || true
          cargo clippy --locked -p liminika-core --all-targets --all-features -- -D warnings
          cargo nextest run --locked -p liminika-core --lib --tests --all-features

      - name: Check Rust documentation integrity (Ubuntu only)
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps --all-features

      - name: Run Rust workspace unit, integration, & zero-alloc tests via nextest (Unix)
        if: runner.os != 'Windows'
        run: |
          ulimit -s 16384 || true
          cargo test --locked --workspace --doc --all-features
          cargo nextest run --locked --workspace --all-targets --all-features

      - name: Run Rust workspace unit, integration, & zero-alloc tests via nextest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked --workspace --doc --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked --workspace --all-targets --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # =========================================================================
  # 6. DSL SPEC & EXAMPLES VALIDATION
  # =========================================================================
  dsl-validation:
    name: Validate DSL Spec & Examples
    needs: [changes, auto-format]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && (needs.auto-format.result == 'success' || needs.auto-format.result == 'skipped') && (needs.changes.outputs.dsl == 'true' || needs.changes.outputs.rust == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-format.outputs.formatted_sha || '' }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      - name: Test DSL crate & Validate Example DSL files
        run: |
          cargo test --locked -p liminika-dsl
          EXCLUDE_ARGS=( \( -name target -o -name "build*" -o -name "cmake-build*" -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name .scratch -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache -o -name models -o -name containers \) )
          DSL_FILES=$(find . "${EXCLUDE_ARGS[@]}" -prune -o -name "*.lmnk" -type f -print)
          if [ -z "$DSL_FILES" ]; then
            echo "Error: No .lmnk DSL files found to validate."
            exit 1
          fi
          for file in $DSL_FILES; do
            echo "Checking $file..."
            cargo run --locked -p liminika-cli -- check "$file"
          done

  # =========================================================================
  # 7. PYTHON SCRIPT SYNTAX & CLI VERIFICATION
  # =========================================================================
  python-check:
    name: Python Script Syntax Verification
    needs: [changes, auto-format]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && (needs.auto-format.result == 'success' || needs.auto-format.result == 'skipped') && (needs.changes.outputs.python == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-format.outputs.formatted_sha || '' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python Syntax, CLI Smoke Checks & Unit Tests
        run: |
          echo "Verifying Python syntax..."
          EXCLUDE_ARGS=( \( -name target -o -name "build*" -o -name "cmake-build*" -o -name _build -o -name .git -o -name .cargo -o -name .venv -o -name .scratch -o -name node_modules -o -name vendor -o -name third_party -o -name 3rdparty -o -name __pycache__ -o -name .cache -o -name models -o -name containers \) )
          PY_FILES=$(find . "${EXCLUDE_ARGS[@]}" -prune -o -name "*.py" -type f -print 2>/dev/null || true)
          if [ -n "$PY_FILES" ]; then
            echo "$PY_FILES" | xargs python -m py_compile
            echo "All Python scripts passed syntax validation."
          fi

          if [ -f "scripts/generate_bench_report.py" ]; then
            python scripts/generate_bench_report.py --help >/dev/null
          fi
          if [ -f "scripts/run_benchmarks.py" ]; then
            python scripts/run_benchmarks.py --help >/dev/null
            python scripts/run_benchmarks.py --dry-run >/dev/null
          fi
          if [ -f "scripts/verify_architecture.py" ]; then
            python scripts/verify_architecture.py --help >/dev/null
          fi

          if [ -d "tests" ]; then
            PY_TEST_FILES=$(find tests -type f \( -name "test_*.py" -o -name "*_test.py" \) 2>/dev/null || true)
            if [ -n "$PY_TEST_FILES" ]; then
              python -m unittest discover -s tests
            fi
          fi

  # =========================================================================
  # 8. META & CITATION VALIDATION
  # =========================================================================
  meta-citation-check:
    name: Validate Meta & Citation Files
    needs: [changes, auto-format]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && (needs.auto-format.result == 'success' || needs.auto-format.result == 'skipped') && (needs.changes.outputs.meta == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-format.outputs.formatted_sha || '' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cffconvert & Validate CITATION.cff Schema
        run: |
          python -m pip install --quiet --retries 1 --timeout 10 cffconvert
          cffconvert --validate

  # =========================================================================
  # 9. DOCUMENTATION INTEGRITY & LINK CHECK
  # =========================================================================
  docs-check:
    name: Documentation Integrity & Link Check
    needs: [changes, auto-format]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && (needs.auto-format.result == 'success' || needs.auto-format.result == 'skipped') && (needs.changes.outputs.docs == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-format.outputs.formatted_sha || '' }}

      - name: Check markdown broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --offline --exclude ".*target/criterion.*" '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
